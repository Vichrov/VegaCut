name: VegaCut Windows x64

on:
  push:
    branches: [main, vegacut-v030]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 120
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libasound2-dev
      command: |
        cargo xtask ci
        FILMCRAFT_UI_SNAPSHOT_DIR=/tmp/vegacut-screens cargo test --locked --workspace workspaces_ui::vegacut_workspace_controls_and_persistence -- --exact
        python - <<'PYTHON'
        import base64
        from pathlib import Path
        for name in ['vegacut-v030.png', 'vegacut-v030-ru.png']:
            data = Path('/tmp/vegacut-screens', name).read_bytes()
            print('VEGACUT_SCREENSHOT ' + name + ' ' + base64.b64encode(data).decode())
        PYTHON
  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Test project persistence and edits
        run: cargo test --locked -p filmcraft-engine -p filmcraft-edit -p filmcraft-format
      - name: Build portable package
        shell: pwsh
        run: ./packaging/windows/vegacut-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VegaCut-windows-x64
          path: dist/release/vegacut-*
          if-no-files-found: error
      - name: Publish alpha release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vegacut-v030'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = [regex]::Match((Get-Content apps/filmcraft/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $Version) { throw 'Missing version' }
          if ($env:GITHUB_REF -eq 'refs/heads/vegacut-v030') {
            git fetch --unshallow origin
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch release history' }
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch main' }
            git merge-base --is-ancestor origin/main HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Main changed; candidate requires review' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fast-forward main' }
          }
          gh release view "v$Version" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Version already published"; exit 0 }
          gh release create "v$Version" dist/release/vegacut-* --target $env:GITHUB_SHA --prerelease --title "VegaCut v$Version" --notes-file docs/VEGACUT_RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
